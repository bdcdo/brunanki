name: CI

# Só verificação. O deploy foi aposentado junto com o Fly e não volta por
# este arquivo: publicar é decisão separada, com workflow próprio.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions fixadas em SHA, não em tag: tag é mutável e pode ser reapontada, e o
# SHA é a única referência imutável.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:validate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
