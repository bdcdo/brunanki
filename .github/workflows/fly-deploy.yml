name: Fly Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy por vez: com scale-to-zero, deploys empilhados só invalidam o
# snapshot de memória repetidamente e cada um força um cold start.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

# Actions fixadas em SHA, não em tag ou branch: tag é mutável e pode ser
# reapontada, e `@master` do setup-flyctl seguiria qualquer commit novo do
# repositório de terceiro. O SHA é a única referência imutável.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:validate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
