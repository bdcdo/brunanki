# Fly.io — app único, sem worker e sem secrets: o Brunanki é essencialmente SSG e
# guarda todo o progresso no navegador.
#
# On demand total: min_machines_running = 0 faz a máquina dormir sem tráfego e
# acordar na primeira requisição. `suspend` restaura um snapshot de RAM (~100 a
# 300 ms) em vez de dar boot completo (~2 s). A elegibilidade exige RAM <= 2 GB
# e ausência de swap — por isso não configure swap_size_mb aqui. Quando o
# snapshot não estiver disponível (todo deploy o invalida, migração de host
# também), o Fly cai para `stop` sozinho.

app = "brunanki"
primary_region = "gru" # São Paulo

[build]

[env]
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "suspend"
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  # 512 MB e não 256: o build roda no builder do Docker, não aqui, mas o Node
  # sozinho consome de 60 a 90 MB de heap e OOM é a falha mais comum de Next.js
  # self-hosted. Com scale-to-zero a diferença de custo é de centavos.
  memory = "512mb"
